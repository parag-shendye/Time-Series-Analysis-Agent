[project]
name = "skab-agent"
version = "0.1.0"
description = "Agentic time-series analysis on SKAB using Ollama"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "ruptures",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "skab_detect*"]
